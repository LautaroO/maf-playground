name: maf-playground

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maf_playground}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: ${ASPIRE_DASHBOARD_ALLOW_ANONYMOUS:-true}
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${OTEL_EXPORTER_OTLP_GRPC_PORT:-4317}:18889"
      - "${OTEL_EXPORTER_OTLP_HTTP_PORT:-4318}:18890"
    restart: unless-stopped

volumes:
  postgres-data:
