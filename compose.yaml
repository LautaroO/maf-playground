name: maf-playground

services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: ${ASPIRE_DASHBOARD_ALLOW_ANONYMOUS:-true}
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${OTEL_EXPORTER_OTLP_GRPC_PORT:-4317}:18889"
      - "${OTEL_EXPORTER_OTLP_HTTP_PORT:-4318}:18890"
    restart: unless-stopped
